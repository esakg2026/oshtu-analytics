<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Наблюдение с камер — Аналитика ОшТУ</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cameras.css" />
</head>
<body class="cam-page">
  <div id="appView" hidden>
    <header class="top">
      <div class="wrap top-row">
        <div class="brand">
          <img src="icon.svg" alt="" width="34" height="34" />
          <div>
            <h1 data-i18n="cam.title">Наблюдение с камер</h1>
            <p class="muted"><span id="hostLabel"></span> · <span id="who"></span></p>
          </div>
        </div>
        <div class="filters">
          <a class="btn" href="./" data-i18n="cam.back">← К аналитике</a>
          <div class="seg lang-seg" id="aLang">
            <button data-lang="ru">RU</button><button data-lang="ky">KY</button><button data-lang="en">EN</button>
          </div>
          <button class="btn" id="logout" data-i18n="cam.signOut">Выйти</button>
        </div>
      </div>
      <nav class="wrap tabs" id="camTabs">
        <a href="#watch" data-tab="watch" class="active" data-i18n="cam.tabs.watch">Наблюдение</a>
        <a href="#setup" data-tab="setup" data-i18n="cam.tabs.setup">Камеры</a>
        <a href="#stats" data-tab="stats" data-i18n="cam.tabs.stats">Аналитика</a>
      </nav>
    </header>

    <main class="wrap">
      <!-- ===== Наблюдение: все камеры этого компьютера ===== -->
      <section id="tab-watch" class="tabpane">
        <div class="card pair-status" id="pairStatus">
          <div>
            <div class="ps-main" id="psMain">—</div>
            <div class="ps-sub" id="psSub"></div>
          </div>
          <div class="ps-tools">
            <button class="btn" id="rescan" data-i18n="cam.rescan">🔍 Найти камеры</button>
            <label class="chk"><input type="checkbox" id="wBoxes" checked /> <span data-i18n="cam.boxes">Рамки</span></label>
            <label class="chk"><input type="checkbox" id="wBlur" /> <span data-i18n="cam.blur">Размыть видео</span></label>
            <span class="status" id="wModel"></span>
          </div>
        </div>
        <p class="privacy">🔒 <span data-i18n="cam.privacy"></span> <span data-i18n="cam.mode247"></span> <b data-i18n="cam.keepOpen"></b></p>
        <p id="wInfo" class="note"></p>
        <p id="wErr" class="err" hidden></p>
        <div id="grid" class="cam-grid"></div>
        <div class="card small" id="sendInfo"><span id="wSent"></span> <span id="wQueue"></span></div>
      </section>

      <!-- ===== Камеры: привязка к аудиториям ===== -->
      <section id="tab-setup" class="tabpane" hidden>
        <div class="card">
          <div class="card-head"><h2 data-i18n="cam.thisPc">Этот компьютер</h2></div>
          <div class="host-row">
            <label class="fld"><span data-i18n="cam.pcName">Название компьютера</span><input id="hostName" maxlength="60" /></label>
            <button class="btn btn-primary" id="hostSave" data-i18n="cam.save">Сохранить</button>
            <button class="btn" id="rescan2" data-i18n="cam.rescan">🔍 Найти камеры</button>
          </div>
          <p class="note" data-i18n="cam.assignHint"></p>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 data-i18n="cam.setupTitle">Камеры и аудитории</h2>
            <button class="btn" id="addIp" data-i18n="cam.addIp">＋ IP-камера</button>
          </div>
          <div class="table-wrap">
            <table class="tbl setup-tbl" id="sTable">
              <thead><tr>
                <th data-i18n="cam.host">Компьютер</th><th data-i18n="cam.name">Название</th><th data-i18n="cam.room">Аудитория</th>
                <th data-i18n="cam.source">Источник</th><th data-i18n="cam.enabled">Вкл.</th><th data-i18n="cam.last">Последние данные</th><th></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <form id="ipForm" class="card" hidden>
          <div class="form-grid">
            <label class="fld"><span data-i18n="cam.name">Название</span><input id="ipName" maxlength="80" required /></label>
            <label class="fld"><span data-i18n="cam.source">Адрес</span><input id="ipUrl" type="url" placeholder="https://camera.example/video.mjpg" maxlength="500" required /></label>
            <label class="fld"><span data-i18n="cam.room">Аудитория</span><select id="ipRoom"></select></label>
          </div>
          <p class="note" data-i18n="cam.urlHint"></p>
          <p id="ipErr" class="err" hidden></p>
          <div class="form-actions">
            <button class="btn btn-primary" type="submit" data-i18n="cam.save">Сохранить</button>
            <button class="btn" type="button" id="ipCancel" data-i18n="cam.cancel">Отмена</button>
          </div>
        </form>
      </section>

      <!-- ===== Аналитика: план ОшТУ vs факт ===== -->
      <section id="tab-stats" class="tabpane" hidden>
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="cam.statsTitle">План ОшТУ и факт с камер</h2>
            <div class="seg" id="aPeriod">
              <button data-v="today" class="active" data-i18n="cam.period.today">Сегодня</button>
              <button data-v="d7" data-i18n="cam.period.d7">7 дней</button>
              <button data-v="d30" data-i18n="cam.period.d30">30 дней</button>
            </div>
          </div>
          <p class="note" id="aThreshold"></p>
        </div>
        <div class="kpis" id="aKpis"></div>
        <div id="aEmpty" class="card empty-note" hidden data-i18n="cam.noData"></div>
        <div class="grid2" id="aCharts">
          <div class="card">
            <div class="card-head"><h2 data-i18n="cam.byPair">Среднее число людей по номерам пар</h2></div>
            <div id="aByPair" class="bars"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2 data-i18n="cam.events">Расхождения с расписанием</h2></div>
            <div id="aEvents"></div>
          </div>
        </div>
        <div class="card" id="aRoomsCard">
          <div class="card-head"><h2 data-i18n="cam.byRoom">По аудиториям</h2></div>
          <div class="table-wrap">
            <table class="tbl" id="aRooms">
              <thead><tr>
                <th data-i18n="cam.rth.room"></th><th class="num" data-i18n="cam.rth.minutes"></th><th class="num" data-i18n="cam.rth.planned"></th>
                <th class="num" data-i18n="cam.rth.held"></th><th class="num" data-i18n="cam.rth.missed"></th><th class="num" data-i18n="cam.rth.extra"></th>
                <th class="num" data-i18n="cam.rth.avg"></th><th class="num" data-i18n="cam.rth.max"></th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="i18n.js"></script>
  <script src="cam-i18n.js"></script>
  <script src="engine.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" defer></script>
  <script src="cameras.js" defer></script>
</body>
</html>
